# Compose cho developer đối tác: chạy image core thật cùng connector CỦA BẠN trên máy, để thấy trọn luồng thanh toán
# (HTTP vào core → gRPC tới connector → đối tác) trước khi gửi connector đi review. CHỈ cho máy phát triển:
# APP_ENV=development, CONNECTOR_INSECURE=true (gRPC không mã hoá), mật khẩu cố định. Không dùng cho production.
#
# Bắt buộc đặt (không có mặc định, thiếu thì compose từ chối chạy):
#   PAYMENT_CORE_IMAGE  image của core do đội nền tảng cấp (tên đầy đủ kèm tag); phải là image bạn đã tự dựng hoặc kéo
#                       về máy (đừng đặt tên cục bộ mà bạn chưa có: compose sẽ thử kéo tên đó từ registry công khai)
#   CONNECTOR_NAME      tên connector của bạn, khớp acme.Name đã đổi (^[a-z][a-z0-9_]{0,31}$)
#   JWT_KEYS            khoá ký token của core: JWT_KEYS="k1:$(openssl rand -base64 32)"
# Tuỳ chọn: CONNECTOR_METHOD (phương thức connector khai, mặc định wallet: để `method` trong request tự chọn connector
# của bạn), PAYMENT_HTTP_PORT (cổng core trên máy, mặc định 8080, chỉ loopback).
#
#   export PAYMENT_CORE_IMAGE=... CONNECTOR_NAME=acme JWT_KEYS="k1:$(openssl rand -base64 32)"
#   docker compose up -d --build --wait connector mariadb
#   docker compose run --rm migrate && docker compose up -d serve
#   docker compose run --rm -T serve client create --code dev --name Dev --scopes payment:create,payment:read
#   # rồi POST http://127.0.0.1:8080/v1/oauth/token và /v1/payments (README của core, mục API)
#
# Gỡ: compose nội suy cả file kể cả khi down nên `down` cũng cần đủ ba biến bắt buộc (giá trị tuỳ ý cho JWT_KEYS):
#   PAYMENT_CORE_IMAGE=x CONNECTOR_NAME=x JWT_KEYS=x docker compose down -v
#
# Không có Kafka, worker, Redis: serve chạy được không cần chúng. Idempotency dùng bản trong bộ nhớ (một tiến trình) vì
# không đặt REDIS_ADDR; outbox vẫn ghi vào MariaDB nhưng không ai gửi lên Kafka, bộ quét/đối soát không chạy. Muốn thử
# các phần đó thì thêm service `redis` (đặt REDIS_ADDR: redis:6379 cho serve), `kafka` và `worker` (`command: ["worker"]`,
# KAFKA_BROKERS, cùng biến môi trường như serve) theo deploy/compose/docker-compose.yml của repo core.
name: payment-connector-dev

services:
  mariadb:
    image: mariadb:10.11
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_nopad_bin
      # Cấu hình ghi bền mà core bắt buộc lúc khởi động.
      - --innodb-flush-log-at-trx-commit=1
      - --sync-binlog=1
    environment:
      MARIADB_ROOT_PASSWORD: secret
      MARIADB_DATABASE: payment
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s

  # Connector của bạn, dựng từ Dockerfile ở thư mục này. Đặt biến môi trường của đối tác (ACME_* trong mẫu; đổi tiền tố
  # sau khi đổi tên) ở đây hoặc qua env_file; KHÔNG commit secret thật.
  connector:
    build: .
    environment:
      ACME_BASE_URL: ${ACME_BASE_URL:-https://api.acme.example}
      ACME_MERCHANT_ID: ${ACME_MERCHANT_ID:-}
      ACME_SECRET_KEY: ${ACME_SECRET_KEY:-}
      CONNECTOR_LISTEN_ADDR: ":9090"
      CONNECTOR_INSECURE: "true"

  migrate:
    image: ${PAYMENT_CORE_IMAGE:?đặt PAYMENT_CORE_IMAGE là image của core}
    command: ["migrate"]
    environment: &core-env
      APP_ENV: development
      JWT_ISSUER: payment-v2
      JWT_KEYS: ${JWT_KEYS:?đặt JWT_KEYS="k1:$(openssl rand -base64 32)"}
      DB_SHARDS: "0-63=root:secret@tcp(mariadb:3306)/payment"
      CONNECTOR_TARGETS: "${CONNECTOR_NAME:?đặt CONNECTOR_NAME là tên connector của bạn}=connector:9090"
      CONNECTOR_METHOD_DEFAULTS: "${CONNECTOR_METHOD:-wallet}=${CONNECTOR_NAME}"
      CONNECTOR_INSECURE: "true"
    depends_on:
      mariadb:
        condition: service_healthy
    restart: "no"

  serve:
    image: ${PAYMENT_CORE_IMAGE:?đặt PAYMENT_CORE_IMAGE là image của core}
    command: ["serve"]
    environment:
      <<: *core-env
      HTTP_ADDR: ":8080"
    ports:
      - "127.0.0.1:${PAYMENT_HTTP_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      connector:
        condition: service_started

volumes:
  mariadb-data:
